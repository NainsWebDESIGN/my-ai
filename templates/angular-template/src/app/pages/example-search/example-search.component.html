<app-search-option-layout>
  <ng-container search>
    <div class="pa-4">
      <div class="row">
        <mat-form-field appearance="outline" class="col">
          <mat-label>開始日期</mat-label>
          <input matInput type="date" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="col">
          <mat-label>結束日期</mat-label>
          <input matInput type="date" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="col">
          <mat-label></mat-label>
          <input matInput placeholder="搜尋..." />
        </mat-form-field>
      </div>
    </div>
  </ng-container>

  <ng-container content>
    <mat-toolbar class="table-toolbar px-3">
      <app-refresh-btn (refresh)="refresh()"></app-refresh-btn>
      <app-search-bar [control]="searchControl"></app-search-bar>
    </mat-toolbar>

    <table mat-table [dataSource]="filteredData" class="w-100">
      <ng-container matColumnDef="key1">
        <th mat-header-cell *matHeaderCellDef>Key 1</th>
        <td mat-cell *matCellDef="let row">{{ row.key1 }}</td>
      </ng-container>
      <ng-container matColumnDef="key2">
        <th mat-header-cell *matHeaderCellDef>Key 2</th>
        <td mat-cell *matCellDef="let row">{{ row.key2 }}</td>
      </ng-container>
      <ng-container matColumnDef="key3">
        <th mat-header-cell *matHeaderCellDef>Key 3</th>
        <td mat-cell *matCellDef="let row">{{ row.key3 }}</td>
      </ng-container>
      <ng-container matColumnDef="toast">
        <th mat-header-cell *matHeaderCellDef>範例Toast</th>
        <td mat-cell *matCellDef="let row">
          <button mat-flat-button color="primary" (click)="showToast()">範例Toast</button>
        </td>
      </ng-container>
      <ng-container matColumnDef="modal">
        <th mat-header-cell *matHeaderCellDef>範例彈窗</th>
        <td mat-cell *matCellDef="let row">
          <button mat-flat-button color="primary" (click)="openModal()">開啟範例 modal</button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </ng-container>
</app-search-option-layout>
